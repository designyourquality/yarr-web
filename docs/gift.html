<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노래 선물이 도착했어요 · YARR</title>
<!-- 선물 링크는 받은 사람만: 검색 · 주소 전달 막기 -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="description" content="누군가 당신을 위해 만든 노래가 도착했어요">
<meta property="og:title" content="🎁 노래 선물이 도착했어요">
<meta property="og:description" content="당신만을 위해 만든 노래예요. 눌러서 들어 보세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="YARR">
<meta property="og:image" content="https://yarrmusic.com/icon.png">
<meta name="theme-color" content="#121214">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
:root{--bg:#121214;--card:#1B1B1F;--line:rgba(255,255,255,.1);--text:#F4F1EC;--soft:#A8A29E;--or:#FF6B24;--orHi:#FF9A5C;--cream:#F7EBDD}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(120% 70% at 50% -10%,rgba(255,107,36,.22),transparent 60%),radial-gradient(80% 50% at 50% 110%,rgba(255,154,92,.08),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:460px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:12.5px}
.top .logo{width:26px;height:26px;border-radius:8px;background:url(icon.png) center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,160,110,.4)}
.top b{color:var(--text);font-weight:800;letter-spacing:.06em}
.ai{margin-left:auto;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,154,92,.45);color:var(--orHi);background:rgba(255,107,36,.08)}

/* 봉투 (처음 화면) */
.env{margin-top:9vh;text-align:center}
.env .to{font-size:15px;color:var(--soft)}
.env h1{font-size:26px;line-height:1.35;font-weight:900;margin:8px 0 26px;word-break:keep-all}
.box{position:relative;width:180px;height:150px;margin:58px auto 34px;animation:bob 3.2s ease-in-out infinite}
.box .lid{position:absolute;left:0;right:0;top:0;height:42px;border-radius:12px;background:linear-gradient(180deg,#FF8A4C,#E85A16);box-shadow:0 6px 0 #9E3A08}
.box .body{position:absolute;left:12px;right:12px;top:48px;bottom:0;border-radius:12px;background:linear-gradient(180deg,#F26A26,#C9480C);box-shadow:inset 0 2px 0 rgba(255,255,255,.18)}
.box .rib{position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--cream);opacity:.92;border-radius:3px}
.box .bow{position:absolute;left:50%;top:-30px;width:110px;height:40px;margin-left:-55px}
.box .bow:before,.box .bow:after{content:'';position:absolute;top:4px;width:46px;height:32px;border:7px solid var(--cream);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.box .bow:before{left:4px;transform:rotate(-14deg)}.box .bow:after{right:4px;transform:rotate(14deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 30px;border-radius:999px;background:linear-gradient(180deg,#FF7B38,#E05214);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 0 #7A2804,0 14px 30px rgba(255,94,26,.35);transition:transform .08s}
.cta:active{transform:translateY(4px);box-shadow:0 4px 0 #7A2804,0 8px 20px rgba(255,94,26,.3)}
.env .from{margin-top:18px;font-size:13px;color:var(--soft)}

/* 플레이어 */
.player{display:none;margin-top:18px}
.opened .env{display:none}.opened .player{display:block;animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.deck{position:relative;aspect-ratio:1/1;max-width:340px;margin:6px auto 0;border-radius:28px;padding:22px;background:linear-gradient(145deg,#2A2622,#17161A);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.deck .led{position:absolute;left:16px;top:16px;width:7px;height:7px;border-radius:50%;background:#3A2A20}
.playing .deck .led{background:#FFB37A;box-shadow:0 0 10px #FF8A4C}
.lp{position:relative;width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#121212 0 1.6px,#1C1C1E 1.6px 3.2px);box-shadow:0 10px 24px rgba(0,0,0,.6),inset 0 0 0 6px #0C0C0C;animation:spin 3.6s linear infinite;animation-play-state:paused}
.lp:after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 12%,rgba(255,255,255,.07) 16%,transparent 22% 58%,rgba(255,255,255,.05) 62%,transparent 68%)}
.playing .lp{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF9A5C,#E5561A 60%,#B83B07);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;z-index:1}
.label:after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#17161A}
.label small{font-size:8px;letter-spacing:.18em;color:rgba(255,255,255,.75);font-weight:800;margin-bottom:16px}
.label span{font-size:11px;font-weight:800;color:#fff;line-height:1.2;margin:0;max-height:2.4em;overflow:hidden;word-break:keep-all}
.arm{position:absolute;right:20px;top:18px;width:16px;height:62%;transform-origin:8px 8px;transform:rotate(-26deg);transition:transform .8s cubic-bezier(.3,1.3,.5,1);z-index:2}
.playing .arm{transform:rotate(4deg)}
.arm:before{content:'';position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#E7E2DA,#8F8A83)}
.arm i{position:absolute;left:6px;top:8px;width:4px;height:100%;border-radius:2px;background:linear-gradient(90deg,#CFC9C0,#8A857E)}
.arm b{position:absolute;left:1px;bottom:-10px;width:14px;height:20px;border-radius:3px;background:#2B2724;border:1px solid #57514B}
.meta{text-align:center;margin-top:20px}
.meta h2{font-size:22px;font-weight:900;line-height:1.3;word-break:keep-all}
.meta p{margin-top:5px;font-size:13px;color:var(--soft)}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:16px}
.pp{flex:none;width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#FF7B38,#E05214);box-shadow:0 5px 0 #7A2804;display:grid;place-items:center}
.pp:active{transform:translateY(3px);box-shadow:0 2px 0 #7A2804}
.pp svg{width:22px;height:22px;fill:#fff}
.bar{flex:1}
.bar input{width:100%;accent-color:var(--or)}
.bar .t{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums;margin-top:2px}
.note{margin-top:22px;padding:18px 18px 16px;border-radius:16px;background:var(--cream);color:#3B2A1E;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-1deg)}
.note p{font-family:'Nanum Pen Script',cursive;font-size:25px;line-height:1.25;white-space:pre-wrap;word-break:keep-all}
.note .sig{margin-top:6px;text-align:right;font-family:'Nanum Pen Script',cursive;font-size:21px;color:#8A5A3A}
.lyr{margin-top:22px;border-radius:16px;background:var(--card);border:1px solid var(--line);position:relative}
.lyr h3{font-size:12px;letter-spacing:.14em;color:var(--soft);font-weight:800;padding:14px 16px 0}
.lyr .scroll{max-height:260px;overflow-y:auto;padding:10px 16px 60px;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(transparent 0,#000 18px,#000 calc(100% - 50px),transparent)}
.lyr .sec{font-size:10.5px;letter-spacing:.16em;color:var(--orHi);font-weight:800;margin:14px 0 4px}
.lyr .ln{font-size:16px;line-height:1.7;color:#E7E2DA;word-break:keep-all}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--soft);line-height:1.6}
.foot a{color:var(--orHi);font-weight:800;text-decoration:none}
.err{display:none;margin-top:16vh;text-align:center}
.err h1{font-size:20px;font-weight:900;margin-bottom:8px}.err p{color:var(--soft);font-size:14px;line-height:1.6}
.bad .env,.bad .player{display:none}.bad .err{display:block}
.load .env h1,.load .env .cta{opacity:.4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.box,.lp{animation:none}.arm{transition:none}}
</style>
</head>
<body class="load">
<div class="wrap">
  <div class="top"><span class="logo" aria-hidden="true"></span><b>YARR</b><span class="ai" title="AI 작곡 · AI 가창">🤖 AI로 만든 노래</span></div>

  <section class="env" aria-live="polite">
    <p class="to" id="envTo">&nbsp;</p>
    <h1>노래 선물이<br>도착했어요</h1>
    <div class="box" aria-hidden="true"><div class="lid"></div><div class="body"></div><div class="rib"></div><div class="bow"></div></div>
    <button class="cta" id="open"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>열어서 듣기</button>
    <p class="from" id="envFrom"></p>
  </section>

  <section class="player">
    <div class="deck">
      <span class="led"></span>
      <div class="lp"><div class="label"><small>FOR YOU</small><span id="lpTitle"></span></div></div>
      <div class="arm" aria-hidden="true"><i></i><b></b></div>
    </div>
    <div class="meta"><h2 id="title"></h2><p id="sub"></p></div>
    <div class="ctrl">
      <button class="pp" id="pp" aria-label="재생"><svg viewBox="0 0 24 24"><path id="ppIcon" d="M8 5v14l11-7z"/></svg></button>
      <div class="bar"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치"><div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
    </div>
    <div class="note" id="note" hidden><p id="msg"></p><div class="sig" id="sig"></div></div>
    <div class="lyr" id="lyr" hidden><h3>LYRICS</h3><div class="scroll" id="lyrics"></div></div>
    <div class="foot">
      AI가 작곡하고 노래한 곡이에요 · 이 링크를 받은 사람만 들을 수 있어요<br>
      <a href="https://yarrmusic.com/" rel="noopener">나도 노래 선물하기 →</a>
    </div>
  </section>

  <section class="err"><h1>선물을 찾을 수 없어요</h1><p>링크가 잘못됐거나, 보낸 사람이 선물을 거둬들였어요.<br>보낸 분께 링크를 다시 받아 주세요.</p></section>
</div>
<audio id="au" preload="none"></audio>
<script>
(() => {
  'use strict';
  const API = 'https://ixgwiwohdczeklnurmon.supabase.co/functions/v1/house-music/web';
  const OCC = { birthday: '생일 축하 노래', anniversary: '기념일 노래', wedding: '결혼 축하 노래', parents: '감사의 노래', thanks: '고마움의 노래', love: '고백의 노래', friend: '우정의 노래', cheer: '응원의 노래', newstart: '새출발 응원 노래', sorry: '화해의 노래' };
  const SEC = { Verse: 'VERSE', Chorus: 'CHORUS', Bridge: 'BRIDGE', Intro: 'INTRO', Outro: 'OUTRO', 'Pre-Chorus': 'PRE-CHORUS' };
  const $ = (id) => document.getElementById(id);
  const au = $('au');
  const token = new URLSearchParams(location.search).get('g') || '';
  let gift = null, refetched = false, userScroll = 0;

  const fail = () => { document.body.className = 'bad'; };
  const mmss = (s) => (isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00');

  async function load() {
    if (!/^[A-Za-z0-9_-]{22}$/.test(token)) return null;
    const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'gift', token }) }).catch(() => null);
    if (!r || !r.ok) return null;
    return r.json().catch(() => null);
  }

  function render(g) {
    const to = g.to ? `${g.to}에게` : '당신에게';
    $('envTo').textContent = `${to} 🎁`;
    $('envFrom').textContent = g.from ? `보낸 사람 · ${g.from}` : '';
    $('title').textContent = g.title || '노래 선물';
    $('lpTitle').textContent = g.title || '';
    const bits = [g.to ? `${g.to}에게` : null, g.from ? `${g.from} 드림` : null, OCC[g.occasion] || null, g.date ? g.date.replace(/-/g, '.') : null].filter(Boolean);
    $('sub').textContent = bits.join(' · ');
    document.title = `${g.title || '노래 선물'} · YARR`;
    if (g.message) { $('msg').textContent = g.message; $('sig').textContent = g.from ? `— ${g.from}` : ''; $('note').hidden = false; }
    if (g.lyrics) {
      const box = $('lyrics');
      box.textContent = '';
      for (const raw of String(g.lyrics).split('\n')) {
        const l = raw.trim();
        if (!l) continue;
        const m = l.match(/^\[([^\]]+)\]$/);
        const d = document.createElement('div');
        if (m) { d.className = 'sec'; d.textContent = SEC[m[1]] || m[1].toUpperCase(); }
        else { d.className = 'ln'; d.textContent = l; }
        box.appendChild(d);
      }
      $('lyr').hidden = false;
    }
    au.src = g.url;
    document.body.className = '';
  }

  function setIcon(play) { $('ppIcon').setAttribute('d', play ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z'); $('pp').setAttribute('aria-label', play ? '일시 정지' : '재생'); }
  function toggle() { au.paused ? au.play().catch(() => {}) : au.pause(); }

  au.addEventListener('play', () => { document.body.classList.add('playing'); setIcon(true); });
  au.addEventListener('pause', () => { document.body.classList.remove('playing'); setIcon(false); });
  au.addEventListener('ended', () => { document.body.classList.remove('playing'); setIcon(false); });
  au.addEventListener('loadedmetadata', () => { $('dur').textContent = mmss(au.duration); });
  au.addEventListener('timeupdate', () => {
    if (!au.duration) return;
    $('seek').value = String(Math.round((au.currentTime / au.duration) * 1000));
    $('cur').textContent = mmss(au.currentTime);
    // 흐르는 가사: 곡 진행만큼 천천히 내려가요 (직접 스크롤하면 8초 동안 멈춰요)
    const box = $('lyrics');
    if (Date.now() - userScroll > 8000 && box.scrollHeight > box.clientHeight) {
      const p = Math.min(1, Math.max(0, (au.currentTime - 8) / Math.max(1, au.duration - 20)));
      box.scrollTop = p * (box.scrollHeight - box.clientHeight);
    }
  });
  // 링크 주소(1시간 서명)가 끝났으면 한 번만 새로 받아요
  au.addEventListener('error', async () => {
    if (refetched || !gift) return;
    refetched = true;
    const at = au.currentTime;
    const g = await load();
    if (!g || !g.url) return;
    au.src = g.url;
    au.currentTime = at;
    au.play().catch(() => {});
  });
  $('seek').addEventListener('input', (e) => { if (au.duration) au.currentTime = (Number(e.target.value) / 1000) * au.duration; });
  $('pp').addEventListener('click', toggle);
  for (const ev of ['wheel', 'touchmove']) $('lyrics').addEventListener(ev, () => { userScroll = Date.now(); }, { passive: true });
  $('open').addEventListener('click', () => {
    document.body.classList.add('opened');
    au.play().catch(() => {});
  });

  load().then((g) => { if (!g || !g.url) return fail(); gift = g; render(g); }).catch(fail);
})();
</script>
</body>
</html>
