# YARR 자동 검수: 30분마다 새로 올라온 곡의 음량을 재고 -14 LUFS 로 맞추고, YARR 안 중복 · 제목을 검사하고,
# (키가 있으면) 기존 상업 음원과 대조해서 확실한 건 자동 승인 · 반려, 애매한 건 관리자에게 남겨요.
# 바로 돌리고 싶으면 GitHub → Actions → "YARR 자동 검수" → Run workflow
# 워커 파일 이름이 inspect.py 면 파이썬 기본 모듈(inspect)과 겹쳐 오류가 나서 review.py 로 씀
name: YARR 자동 검수
on:
  schedule:
    - cron: '7,37 * * * *'   # 정각은 GitHub 이 붐벼서 자주 밀려요
  workflow_dispatch:
concurrency:
  group: yarr-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04   # Ubuntu 26 의 FFmpeg 8 은 AAC 변환 피크가 튀어요 (2026-10-28 확인) · 24.04 = FFmpeg 6.1
    timeout-minutes: 60   # 대기 곡을 한 번에 끝까지 처리 (워커 시간 한도 RUN_BUDGET_MIN 기본 40분)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ACR_HOST: ${{ secrets.ACR_HOST }}
      ACR_ACCESS_KEY: ${{ secrets.ACR_ACCESS_KEY }}
      ACR_ACCESS_SECRET: ${{ secrets.ACR_ACCESS_SECRET }}
      # Settings → Secrets and variables → Actions → Variables 탭에서 바꿀 수 있어요 (없으면 기본값)
      AUTO_DECIDE: ${{ vars.AUTO_DECIDE || '1' }}
      AUTO_APPROVE_WITHOUT_ACR: ${{ vars.AUTO_APPROVE_WITHOUT_ACR || '0' }}
      # 보컬 오리지널 받아쓰기 기준 (넣은 가사 중 알아들은 비율): 이상이면 자동 승인 / 미만이면 반려 / 그 사이는 사람 확인
      LYRIC_APPROVE: ${{ vars.LYRIC_APPROVE || '0.55' }}
      LYRIC_REJECT: ${{ vars.LYRIC_REJECT || '0.25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: ACRCloud 연결 확인 (직접 실행할 때만)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python worker/check_acr.py
      - name: 검수할 곡 확인
        id: count
        run: python worker/review.py --count
      - name: FFmpeg 설치 (검수할 곡이 있을 때만)
        if: steps.count.outputs.pending != '0'
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          ffmpeg -hide_banner -muxers | grep -q chromaprint && echo '음원 지문 사용 가능' || echo '⚠ 이 FFmpeg 에는 음원 지문이 없어요 → 곡은 자동 보류돼요'
      - name: 받아쓰기 모델 캐시 (보컬곡 · 처음 한 번만 받아요)
        if: steps.count.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: 검수 실행
        if: steps.count.outputs.pending != '0'
        run: python worker/review.py
