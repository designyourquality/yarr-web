# YARR 보컬곡 전체 점검 (읽기 전용 · DB 에 쓰지 않아요 · GPU 안 씀)
# 공개 곡 중 가사 있는 곡을 받아 품질 v2 (발음 🟢🟡🔴 · 약한 줄 · 사고) 검사 → Artifacts 'vocal-audit'
# 필요: SUPABASE_URL · SUPABASE_SECRET_KEY (자동 검수와 같은 값)
name: YARR 보컬곡 점검
on:
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt pykakasi==2.3.0
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: sudo mkdir -p /opt/whisper && sudo chmod 777 /opt/whisper
      - uses: actions/cache@v4
        with:
          path: /opt/whisper
          key: whisper-small-opt-v1
      - name: 점검
        run: python worker/vocal_audit.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocal-audit-${{ matrix.shard }}
          path: vocal_audit_out/
          retention-days: 14
